<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visitors Log - Aymen Mabrouk Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="image/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Roboto:wght@300;400&display=swap">
    <style>
        :root {
            --primary: #3B82F6;
            --secondary: #10B981;
            --accent: #F59E0B;
            --neutral: #1F2937;
            --neutral-light: #F3F4F6;
            --white: #FFFFFF;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --primary-gradient: linear-gradient(135deg, var(--primary) 0%, #7C3AED 100%);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--neutral-light);
            color: var(--text-primary);
            margin: 0;
            min-height: 100vh;
            position: relative;
        }
        .animated-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--primary-gradient);
            background-size: 300% 300%;
            animation: gradientShift 15s ease infinite;
            z-index: -2;
            opacity: 0.6;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: -1;
        }
        .particle {
            position: absolute;
            background: rgba(255,255,255,0.7);
            border-radius: 50%;
            will-change: transform, opacity;
            animation: float 8s ease-in-out infinite, fade 4s ease-in-out infinite alternate;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(-20px, -40px) scale(1.5); }
            50% { transform: translate(20px, -60px) scale(1.2); }
            75% { transform: translate(10px, -20px) scale(1.3); }
        }
        @keyframes fade {
            0% { opacity: 0.3; }
            50% { opacity: 0.7; }
            100% { opacity: 0.1; }
        }
        .glass-container {
            max-width: 1100px;
            margin: 70px auto 40px auto;
            background: var(--glass-bg);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(59,130,246,0.10);
            padding: 48px 32px;
            border: 1.5px solid var(--glass-border);
            backdrop-filter: blur(18px);
        }
        .visitors-title {
            text-align: center;
            font-size: 2.7rem;
            margin-bottom: 18px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }
        .visitors-subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.15rem;
            margin-bottom: 40px;
            font-family: 'Roboto', sans-serif;
        }
        h2 {
            font-size: 1.35rem;
            margin: 36px 0 10px 0;
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .visitors-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 16px;
            font-size: 1rem;
            background: var(--white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(59,130,246,0.04);
        }
        .visitors-table th, .visitors-table td {
            padding: 12px 10px;
            border-bottom: 1px solid #E5E7EB;
            text-align: left;
        }
        .visitors-table th {
            background: var(--neutral-light);
            color: var(--primary);
            font-weight: 700;
            font-size: 1.02rem;
            letter-spacing: 0.2px;
        }
        .visitors-table tr:last-child td {
            border-bottom: none;
        }
        .visitors-table tr:hover {
            background: #F1F5F9;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            background: #E0E7FF;
            color: #3730A3;
            font-size: 0.85em;
            margin-right: 4px;
        }
        .icon {
            color: var(--secondary);
            margin-right: 8px;
            font-size: 1.3em;
            vertical-align: middle;
        }
        @media (max-width: 900px) {
            .glass-container { padding: 18px 4px; }
            .visitors-table th, .visitors-table td { font-size: 0.93rem; padding: 7px 3px; }
        }
        @media (max-width: 600px) {
            .glass-container { padding: 6px 0; }
            .visitors-title { font-size: 2rem; }
            .visitors-table th, .visitors-table td { font-size: 0.85rem; padding: 5px 2px; }
            .visitors-table { font-size: 0.9rem; }
        }
        /* Custom scrollbar for consistency */
        ::-webkit-scrollbar {
            height: 8px;
            width: 8px;
            background: #e0e7ef;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="animated-bg"></div>
    <div class="particles" id="particles"></div>
    <div class="glass-container">
        <div class="visitors-title">
            <i class="fas fa-users icon"></i>Visitors Log
        </div>
        <div class="visitors-subtitle">
            <span>See who visited your portfolio and how they interacted.</span>
        </div>
        <h2>Summary by Visitor</h2>
        <table class="visitors-table" id="summaryTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Visitor ID</th>
                    <th>Visits</th>
                    <th>Total Time (s)</th>
                    <th>Last Seen</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
            </tbody>
        </table>
        <h2 style="margin-top:36px;">All Events</h2>
        <table class="visitors-table" id="visitorsTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Date/Time</th>
                    <th>Event</th>
                    <th>Visitor ID</th>
                    <th>Duration (s)</th>
                    <th>User Agent</th>
                    <th>Referrer</th>
                    <th>Language</th>
                    <th>Platform</th>
                    <th>Screen</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="10" style="text-align:center;">Loading...</td></tr>
            </tbody>
        </table>
    </div>
    <script>
        // Animated particles (same style as index.html)
        (function() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = window.innerWidth < 768 ? 18 : 40;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 5 + 2;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.background = `hsl(${Math.random() * 360}, 70%, 80%)`;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = `${Math.random() * 5}s`;
                particle.style.animationDuration = `${Math.random() * 10 + 5}s`;
                particlesContainer.appendChild(particle);
            }
        })();

        fetch('visitors.json')
            .then(res => {
                if (!res.ok) throw new Error('File not found');
                return res.json();
            })
            .then(data => {
                // All Events Table
                const tbody = document.querySelector('#visitorsTable tbody');
                if (!Array.isArray(data) || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;">No visitors yet.</td></tr>';
                } else {
                    tbody.innerHTML = '';
                    data.slice().reverse().forEach((v, i) => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${data.length - i}</td>
                                <td><span class="badge">${v.timestamp ? new Date(v.timestamp).toLocaleString() : ''}</span></td>
                                <td>${v.event || ''}</td>
                                <td style="max-width:120px;word-break:break-all;">${v.visitorId || ''}</td>
                                <td>${v.duration !== undefined ? v.duration : ''}</td>
                                <td style="max-width:220px;word-break:break-all;">${v.userAgent || ''}</td>
                                <td style="max-width:120px;word-break:break-all;">${v.referrer || ''}</td>
                                <td>${v.language || ''}</td>
                                <td>${v.platform || ''}</td>
                                <td>${v.screen ? v.screen.w + 'x' + v.screen.h : ''}</td>
                            </tr>
                        `;
                    });
                }

                // Summary Table
                const summaryTbody = document.querySelector('#summaryTable tbody');
                if (!Array.isArray(data) || data.length === 0) {
                    summaryTbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No visitors yet.</td></tr>';
                } else {
                    // Group by visitorId
                    const summary = {};
                    data.forEach(v => {
                        if (!v.visitorId) return;
                        if (!summary[v.visitorId]) {
                            summary[v.visitorId] = { visits: 0, totalTime: 0, lastSeen: '', lastTimestamp: 0 };
                        }
                        if (v.event === 'entry') {
                            summary[v.visitorId].visits += 1;
                        }
                        if (v.event === 'exit' && typeof v.duration === 'number') {
                            summary[v.visitorId].totalTime += v.duration;
                        }
                        if (v.timestamp) {
                            const ts = new Date(v.timestamp).getTime();
                            if (ts > summary[v.visitorId].lastTimestamp) {
                                summary[v.visitorId].lastSeen = v.timestamp;
                                summary[v.visitorId].lastTimestamp = ts;
                            }
                        }
                    });
                    const summaryArr = Object.entries(summary);
                    summaryTbody.innerHTML = '';
                    summaryArr.sort((a, b) => b[1].lastTimestamp - a[1].lastTimestamp).forEach(([visitorId, info], idx) => {
                        summaryTbody.innerHTML += `
                            <tr>
                                <td>${idx + 1}</td>
                                <td style="max-width:120px;word-break:break-all;">${visitorId}</td>
                                <td>${info.visits}</td>
                                <td>${info.totalTime}</td>
                                <td>${info.lastSeen ? new Date(info.lastSeen).toLocaleString() : ''}</td>
                            </tr>
                        `;
                    });
                }
            })
            .catch((err) => {
                document.querySelector('#visitorsTable tbody').innerHTML = `<tr><td colspan="10" style="text-align:center;color:#EF4444;">Could not load log (${err.message}).<br>Make sure <b>visitors.json</b> exists and is readable.</td></tr>`;
                document.querySelector('#summaryTable tbody').innerHTML = `<tr><td colspan="5" style="text-align:center;color:#EF4444;">Could not load log (${err.message}).</td></tr>`;
            });
    </script>
</body>
</html>
